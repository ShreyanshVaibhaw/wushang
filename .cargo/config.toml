# Build inputs for ffmpeg-sys-next: FFmpeg headers/import libs and libclang for bindgen.
# The FFmpeg here is the slim build from scripts/build-ffmpeg.sh, and libass (loaded at run time,
# copied next to the exe by build.rs) comes from scripts/build-libass.sh.
[env]
FFMPEG_DIR = 'D:\tools\ffmpeg-9.0.2-wushang'
LIBASS_DIR = 'D:\tools\libass-0.17.3'
LIBCLANG_PATH = 'D:\tools\libclang-18.1.1'

# The C runtime goes into the exe, so wushang starts on a PC without the Visual C++
# Redistributable, and Windows never goes looking for vcruntime140.dll in other folders.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
