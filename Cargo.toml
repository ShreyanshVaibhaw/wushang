[package]
name = "wushang"
version = "1.0.4"
edition = "2024"

[dependencies]
cpal = "0.18.2"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "device", "format", "software-resampling", "software-scaling"] }
# AppKit window and event loop, Metal video output, Core Graphics and Core Text for the interface.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-metal = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-core-video = "0.3"
objc2-io-surface = "0.3"
objc2-uniform-type-identifiers = "0.3"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
# The design's SVG icons, rasterised once per scale.
resvg = "0.49"
# Snapshots and pictures picked for playlists.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
# Feeds, the radio directory and the update check, in place of WinHTTP.
ureq = "3"
# Old subtitle files in Windows code pages.
encoding_rs = "0.8"
# libass, loaded at run time as on Windows.
libloading = "0.8"
libc = "0.2"
